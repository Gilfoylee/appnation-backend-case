services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: generations
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d generations"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    # Cache only: bounded memory, least-recently-used keys are evicted first.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot schema migration; the app starts only after it succeeds.
  migrate:
    build: .
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/generations
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://app:app@postgres:5432/generations
      REDIS_URL: redis://redis:6379
      DAILY_QUOTA: 5
      CACHE_TTL_SECONDS: 600
      PROVIDER_TIMEOUT_MS: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
